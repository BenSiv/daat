# Mounts daat's binary as a single CGI script at the domain root.
# ScriptAlias at exactly "/" glues the path onto the script name with no
# separator ("daatlogin"), so ScriptAliasMatch with a capture group does
# the "one script, the rest is PATH_INFO" split instead.
Listen 8000

ServerTokens Prod
ServerSignature Off

<VirtualHost *:8000>
    # DOCUMENT_ROOT is how daat finds its store (config.find_root).
    DocumentRoot /data

    ScriptAliasMatch ^/(.*)$ /app/bin/daat/$1

    # mod_cgid passes the container's environment to the script only
    # for variables named here.
    PassEnv PLATFORM_VENDOR_DIR

    # The load balancer terminates TLS and forwards plain HTTP, so Apache
    # never sets HTTPS itself; daat needs it for Secure cookies and HSTS
    # (doc/auth.md, "Transport").
    SetEnv HTTPS on

    <Directory /app/bin>
        Options +ExecCGI
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
